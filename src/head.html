<title>小勇士大冒险</title>
<style>
/* Layout: a fixed one-screen game. Every screen and page is sized to the viewport; nothing scrolls.
   One UI face (ZCOOL KuaiLe) for all Chinese, one numeral face (Baloo 2); Andika only for pinyin, KaiTi only for the character being taught.
   Look: 「3 头身硬边糖果风」, the same as the original art (src/art): thick dark-brown outlines, flat colour blocks
   (one colour, or two blocks split by a hard edge), one soft shadow under the piece. No glossy highlights, no outline-less flat bits. */
:root{
  color-scheme: light;
  /* ===== 糖果风设计规范（所有按钮、面板、弹窗、标签、进度条、心形、道具按钮都用这一组） =====
     --c-line 描边色 / --c-lw 描边粗细（小件 --c-lw-s）
     --c-sh   底部单层柔和阴影（按下时 --c-sh-press，大面板 --c-sh-l）
     两段色块：background:linear-gradient(var(--c1) var(--c-split), var(--c2) 0)，上浅下深，硬边分界
     糖果色：--cy 黄 / --cg 绿 / --cb 蓝 / --cr 红 / --cp 紫 / --cw 奶白，各有 1（上块）2（下块）两档 */
  --c-line:#3A2A1E;
  --c-lw:3px; --c-lw-s:2px;
  --c-sh:0 4px 0 rgba(58,42,30,.35);
  --c-sh-press:0 1px 0 rgba(58,42,30,.35);
  --c-sh-l:0 6px 0 rgba(58,42,30,.35);
  --c-split:56%;
  --cy1:#ffd84a; --cy2:#ffb627;
  --cg1:#7fdc5b; --cg2:#4cbd3a;
  --cb1:#6cc3ff; --cb2:#3a97f0;
  --cr1:#ff7d8b; --cr2:#f24660;
  --cp1:#b98dff; --cp2:#8c5bef;
  --cw1:#fffaf0; --cw2:#f4e7cf;
  --c-dark:rgba(58,42,30,.82);
  --ink:var(--c-line);
  --ink2:#86684f;
  --cream:#fff8e8;
  --frame1:#ffd66b;
  --frame2:#f0a51a;
  --gold:#ffcd3c; --gold-d:#e09200;
  --green:#5ad14f; --green-d:#2f9a2a;
  --blue:#4aa8ff; --blue-d:#1f68d6;
  --red:#ff5d6c; --red-d:#c8314a;
  --purple:#a070ff; --purple-d:#6c3fd9;
  --night:#1b1640;
  --f-ui:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-num:"Baloo 2","ZCOOL KuaiLe","PingFang SC",sans-serif;
  --f-py:"Andika","Noto Sans","Segoe UI",Arial,sans-serif;
  --f-hz:"KaiTi","STKaiti","Kaiti SC","楷体",serif;
  --wbg:#7fd6ff;
  /* iPhone safe areas (status bar / notch / Dynamic Island / home indicator; left+right in landscape).
     Always use these variables, never env() directly, so the smoke test can simulate a notched phone. */
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{padding:var(--sat) var(--sar) var(--sab) var(--sal);background:var(--night);color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
img{-webkit-user-drag:none;pointer-events:none}
.ei{width:1em;height:1em;object-fit:contain;vertical-align:-0.18em;display:inline-block}
/* 原画图标（icon_*）：和 3D 图一样占 1em 方块 */
.ei.icon{object-fit:contain}
/* 声音开 / 关：原画只有喇叭本体，右边用 SVG 叠声波（开）或红色粗 ×（关），同样深棕描边 */
.ei.snd{position:relative;vertical-align:-0.18em}
.ei.snd>img{position:absolute;left:0;top:6%;width:58%;height:88%;object-fit:contain}
.ei.snd>svg{position:absolute;right:0;top:12%;width:46%;height:76%;overflow:visible}
/* 糖果 SVG 图标（ui.js 的 ICON_SVG）：阴影那一层统一涂深棕、半透明 */
svg.ei.cs{overflow:visible}
.cs .sh{opacity:.3}
.cs .sh *{fill:var(--c-line);stroke:var(--c-line)}
.cs .sh .ln{fill:none}
#app{height:100%;max-width:520px;margin:0 auto;position:relative;overflow:hidden;background:var(--night)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

/* ---------- shared game components ---------- */
.ttl{color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);letter-spacing:1px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
/* every candy piece: --c1 / --c2 = its two colour blocks (same colour twice = solid) */
.btn{--c1:var(--cy1);--c2:var(--cy2);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:8px 18px;border-radius:18px;border:var(--c-lw) solid var(--c-line);
  background:linear-gradient(var(--c1) var(--c-split),var(--c2) 0);color:var(--ink);font:400 22px/1 var(--f-ui);box-shadow:var(--c-sh)}
.btn:active{transform:translateY(3px);box-shadow:var(--c-sh-press)}
.btn:disabled{filter:grayscale(1);opacity:.55}
.btn.green,.btn.blue,.btn.red,.btn.purple{color:#fff;-webkit-text-stroke:4px var(--c-line);paint-order:stroke fill}
.btn.green{--c1:var(--cg1);--c2:var(--cg2)}
.btn.blue{--c1:var(--cb1);--c2:var(--cb2)}
.btn.red{--c1:var(--cr1);--c2:var(--cr2)}
.btn.purple{--c1:var(--cp1);--c2:var(--cp2)}
.btn.white{--c1:var(--cw1);--c2:var(--cw2)}
.btn .ei{font-size:30px}
.ibtn{--c1:var(--cw1);--c2:var(--cw2);position:relative;width:52px;height:52px;flex:none;border-radius:16px;border:var(--c-lw) solid var(--c-line);display:grid;place-items:center;
  background:linear-gradient(var(--c1) var(--c-split),var(--c2) 0);box-shadow:var(--c-sh)}
.ibtn:active{transform:translateY(3px);box-shadow:var(--c-sh-press)}
.ibtn .ei{font-size:32px;vertical-align:0}
.ibtn.round{border-radius:50%}
.badge{position:absolute;right:-8px;top:-8px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--cr2);color:#fff;border:var(--c-lw-s) solid var(--c-line);font:800 14px/20px var(--f-num);text-align:center}
.badge.pulse{animation:pulse 1s ease-in-out infinite}
.cnt{position:absolute;right:-6px;bottom:-6px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:var(--cr2);color:#fff;border:var(--c-lw-s) solid var(--c-line);font:800 15px/20px var(--f-num);text-align:center}
.panel{background:var(--cream);border:var(--c-lw) solid var(--c-line);border-radius:24px;box-shadow:inset 0 0 0 5px var(--cy1),var(--c-sh-l)}
.ribbon{--c1:var(--cr1);--c2:var(--cr2);--ct:#c72d48;position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;padding:6px 26px;border-radius:14px;border:var(--c-lw) solid var(--c-line);
  background:linear-gradient(var(--c1) var(--c-split),var(--c2) 0);color:#fff;font:400 24px/1.1 var(--f-ui);-webkit-text-stroke:4px var(--c-line);paint-order:stroke fill}
.ribbon::before,.ribbon::after{content:"";position:absolute;z-index:-1;top:9px;width:26px;height:calc(100% - 4px);background:var(--ct);border:var(--c-lw) solid var(--c-line)}
.ribbon::before{left:-18px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,9px 50%)}
.ribbon::after{right:-18px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 50%,100% 100%,0 100%)}
.ribbon.gold{--c1:var(--cy1);--c2:var(--cy2);--ct:#de8a00;color:var(--ink);-webkit-text-stroke:0}
.ribbon.blue{--c1:var(--cb1);--c2:var(--cb2);--ct:#2470cc}
.pill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 6px;border-radius:20px;border:var(--c-lw) solid var(--c-line);background:var(--c-dark);color:#fff;font:800 20px/1 var(--f-num)}
.pill .ei{font-size:30px}
.pill.tag{flex:none;height:28px;padding:0 10px;gap:2px;font:400 15px/1 var(--f-ui);white-space:nowrap}
.pill.tag .num{font:800 15px/1 var(--f-num)}
.pill.hot{background:linear-gradient(var(--cr1) var(--c-split),var(--cr2) 0);color:#fff}
.pill.beta{position:absolute;left:12px;top:10px;z-index:3;height:30px;padding:0 10px;font:400 15px/1 var(--f-ui);color:var(--gold);pointer-events:none}
.bar{position:relative;height:20px;border:var(--c-lw) solid var(--c-line);border-radius:999px;background:#5b4636;overflow:hidden;box-shadow:var(--c-sh-press)}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:999px;background:linear-gradient(var(--cr1) 50%,var(--cr2) 0);transition:width .35s}
.bar>span{position:absolute;inset:0;display:grid;place-items:center;font:800 13px/1 var(--f-num);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.tabs{display:flex;gap:8px}
.tab{--c1:var(--cw1);--c2:var(--cw2);flex:1;min-width:0;white-space:nowrap;height:46px;border-radius:14px;border:var(--c-lw) solid var(--c-line);background:linear-gradient(var(--c1) var(--c-split),var(--c2) 0);color:var(--ink2);font:400 19px/1 var(--f-ui);display:flex;align-items:center;justify-content:center;gap:6px;position:relative;box-shadow:var(--c-sh)}
.tab .ei{font-size:26px}
.tab.on{--c1:var(--cy1);--c2:var(--cy2);color:var(--ink)}

/* ---------- MAP: one world per screen ---------- */
#map{background:radial-gradient(120% 80% at 50% 0%,#3a2e7a,var(--night));padding:10px 12px 12px;gap:10px}
.topbar{display:flex;align-items:center;gap:7px}
.topbar .ibtn{width:48px;height:48px}
.topbar .ibtn .ei{font-size:30px}
.topbar .grow{flex:1}
.topbar .avatarbtn{width:56px;height:56px;border-radius:50%}
.topbar .avatarbtn .ei{font-size:40px}
.nexthero{display:flex;align-items:center;gap:6px;justify-content:center;color:#fff;font-size:15px}
.nexthero .ei{font-size:24px}
.nexthero .nh{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:2px;white-space:nowrap;overflow:hidden;opacity:.95}
.nexthero .num{color:var(--gold)}
.nexthero .sil{line-height:0}
.nexthero .sil .ei{filter:brightness(0) invert(1) opacity(.7)}
.nexthero .sil .ei.art{height:1em}
.nexth .sil{line-height:0}
.nexth .sil .ei.art{height:1em}
/* the long map: only .lscroll scrolls (native, momentum on iOS); the bars above stay put */
.wview{position:relative;flex:1;min-height:0}
.lscroll{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;
  border-radius:28px;border:4px solid var(--c-line);box-shadow:var(--c-sh-l);
  /* sky with drifting clouds behind the floating islands */
  background:radial-gradient(60px 22px at 12% 18%,rgba(255,255,255,.95) 60%,transparent 64%) 0 0/100% 520px repeat-y,
    radial-gradient(44px 16px at 20% 21%,rgba(255,255,255,.95) 60%,transparent 64%) 0 0/100% 520px repeat-y,
    radial-gradient(70px 24px at 88% 62%,rgba(255,255,255,.9) 60%,transparent 64%) 0 0/100% 520px repeat-y,
    radial-gradient(40px 15px at 80% 65%,rgba(255,255,255,.9) 60%,transparent 64%) 0 0/100% 520px repeat-y,
    linear-gradient(#8fd8ff,#c9eeff)}
.lmap{position:relative;width:100%;overflow:hidden}
.band{position:absolute;left:0;right:0;background-size:100% 100%;background-repeat:no-repeat}
.band.art{background-size:cover;background-position:center;background-repeat:no-repeat}
/* 世界接缝：两段原画之间一条不透明的云带（图由 cloudURL() 按宽度画），盖住两段的边和小路接口；关卡在云带上面 */
.cloud{position:absolute;left:0;right:0;z-index:1;background-repeat:no-repeat;background-size:100% 100%;pointer-events:none;filter:drop-shadow(0 6px 0 rgba(58,42,30,.22))}
.band .deco{position:absolute;opacity:.95;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25));z-index:1;pointer-events:none}
.cliff{position:absolute;left:0;right:0;bottom:-50px;height:120px;z-index:1;background-size:100% 100%;pointer-events:none;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
.wsign{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:4px;white-space:nowrap}
.wsign .ribbon{font-size:20px;padding:5px 20px}
.wsign .ribbon .num{font:800 20px/1 var(--f-num)}
.wsub2{display:flex;align-items:center;gap:8px}
.wsign small{font-size:13px;color:#fff;background:var(--c-dark);padding:2px 10px;border-radius:10px}
.wsign.locked{filter:grayscale(.7);opacity:.85}
.wsign.cl{bottom:auto;transform:translate(-50%,-50%);gap:6px}
.wrun{min-height:36px;padding:2px 12px 2px 6px;font-size:15px;gap:2px;border-radius:14px}
.wrun .ei{font-size:24px}
.wchest{position:absolute;right:10px;z-index:3;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:0;padding:2px 6px 3px;border-radius:14px;border:var(--c-lw-s) solid var(--c-line);background:var(--cw1);box-shadow:var(--c-sh);font-size:13px;color:var(--ink)}
.wchest .ei{font-size:28px}
.wchest.ready{background:#ffe08a;animation:pulse 1s infinite}
.wchest.opened{opacity:.75}
.hgood{color:#2563eb}
/* 知识题（第五轮）：题图 + 一句话；选项可以是图片（下面写名字）或色块 */
.kq{display:flex;align-items:center;justify-content:center;gap:10px;font:400 clamp(20px,5.6vw,26px)/1.35 var(--f-ui);text-align:left}
.kq .kpic{flex:none;line-height:0}
.kq .kpic .ei.art{width:auto}
.kq .kt b{color:var(--red-d);font-weight:400}
.kt{font:400 clamp(18px,5vw,22px)/1.35 var(--f-ui)}
.mixq{font:800 30px var(--f-num)}
.kopt{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:0;line-height:1.1}
.ktxt{font:400 clamp(20px,5.8vw,26px)/1.2 var(--f-ui)}
.ktxt .num{font-family:var(--f-num);font-weight:800}
.kopt small{font:400 14px var(--f-ui);color:var(--ink2)}
.kopt.spot{height:70px;justify-content:center}
.kopt .ei.art{width:auto}
.cblock{display:block;width:64%;height:42px;border-radius:12px;border:var(--c-lw) solid var(--c-line);margin:0 auto}
/* 神秘勇士：剪影 + 金色光效；没找到时是暗一点的剪影 */
.heroes.h9{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.mys{display:inline-block;line-height:0}
.mys .ei{filter:brightness(0) opacity(.6)}
.mys.found .ei{filter:brightness(0) drop-shadow(0 0 4px #fde047) drop-shadow(0 0 10px #f59e0b);animation:mysGlow 1.6s ease-in-out infinite}
@keyframes mysGlow{50%{filter:brightness(0) drop-shadow(0 0 7px #fef08a) drop-shadow(0 0 16px #f59e0b)}}
.hcard .mys .ei{font-size:clamp(36px,10vw,52px)}
.mys .ei.art{height:1em;width:auto}
.hcard .mys .ei.art{height:clamp(40px,11vw,56px)}
.herostage .mys .ei.art{height:clamp(80px,24vw,104px)}
/* 战斗里的神秘勇士：身体剪影 + 金光，手里的武器盾牌照常显示 */
.av.a-h8>.ei.art{filter:brightness(0) drop-shadow(0 0 4px #fde047) drop-shadow(0 0 10px #f59e0b)!important}
.herostage .mys .ei{font-size:clamp(76px,22vw,96px)}
.herostage.mystic{background:radial-gradient(circle at 18% 50%,#fde68a 0,rgba(255,255,255,0) 45%),linear-gradient(var(--cw1) var(--c-split),var(--cw2) 0)}
.frags{display:flex;align-items:center;justify-content:center;gap:6px;font-size:16px}
.frags .frag{width:20px;height:20px;border-radius:5px;border:var(--c-lw-s) solid var(--c-line);background:#f1e3c8;transform:rotate(8deg)}
.frags .frag.on{background:#fbbf24}
.qhead{display:flex;align-items:center;justify-content:center;gap:8px}
.qhero .ei{font-size:44px}
.qhero .ei.art{height:52px;width:auto}
.qprog{font-size:16px;margin-left:6px}
.qbox{padding:14px 8px}
.qans .ans{min-height:64px}
.wcbig{font-size:84px;line-height:1}
.wcprog{display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px}
.wcprog .xbar{width:60%}
.bst{display:inline-flex;align-items:center;gap:1px;margin-left:6px;font-size:13px}
.bst .ei{font-size:15px}
.bst b{margin-right:3px}
.gkid{display:block;font-size:12px;line-height:1.3;color:var(--ink2);margin-top:2px}
.rnext{margin:0;font-size:14px;color:var(--ink2)}
.rnext .ei{font-size:16px}
.statpop{position:fixed;left:50%;top:40%;z-index:60;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;padding:10px 18px;font-size:20px;transition:transform .2s,opacity .2s}
.statpop.on{transform:translate(-50%,-50%) scale(1);opacity:1}
.statpop p{margin:2px 0;white-space:nowrap}
.statpop b.up{color:#16a34a}.statpop b.down{color:var(--red-d)}
.wcur{flex:none;min-height:34px;padding:2px 10px 2px 4px;gap:2px;font-size:15px;border-radius:14px}
.wcur .ei{font-size:22px}
.wpath{position:absolute;left:0;top:0;width:100%;z-index:2;pointer-events:none}
/* a level on the map = its monster standing right on the road (no frame around it): the node's centre is the monster's
   centre and sits on the painted road. Under its feet an oval shadow, or a ring that tells the state:
   passed = gold ring + stars over its head, current = bouncing blue ring + 小勇士 standing next to it,
   locked = dark silhouette + a small lock, Boss = bigger + red ring. Sizes must match NODE_D / BOSS_D / NODE_* in ui.js. */
.node{position:absolute;z-index:2;transform:translate(-50%,-50%);display:block}
.node .ball{position:relative;display:block;width:54px;height:54px}
.node .ball::before{content:"";position:absolute;left:50%;bottom:-5px;width:46px;height:14px;transform:translateX(-50%);border-radius:50%;background:rgba(58,42,30,.32);z-index:0}
.node .ball>.ei{position:relative;z-index:1;display:block;width:100%;height:100%;font-size:54px;vertical-align:0;object-fit:contain;filter:drop-shadow(0 0 1.5px var(--c-line))}
.node.boss .ball{width:76px;height:76px}
.node.boss .ball>.ei{font-size:76px}
.node.boss .ball::before{width:68px;height:20px;bottom:-7px;background:rgba(255,70,50,.45);border:3px solid #e8322e;box-shadow:0 0 10px rgba(255,60,40,.8)}
.node .lv{position:absolute;left:-6px;top:-6px;z-index:2;min-width:22px;height:22px;border-radius:11px;border:var(--c-lw-s) solid var(--c-line);background:var(--cb2);color:#fff;font:800 13px/18px var(--f-num);text-align:center;padding:0 3px}
.node.boss .lv{background:var(--cr2);font:400 12px/18px var(--f-ui);padding:0 6px;left:-4px;top:-4px}
.node .mb{position:absolute;right:-6px;bottom:-4px;z-index:2;width:22px;height:22px;border-radius:50%;background:var(--cw1);border:var(--c-lw-s) solid var(--c-line);display:grid;place-items:center}
.node .mb .ei{font-size:19px;vertical-align:0}
.node .stars{position:absolute;left:50%;top:-15px;z-index:2;transform:translateX(-50%);display:flex;gap:0;height:14px;line-height:0}
.node.boss .stars{top:-17px}
.node .stars .ei{font-size:14px}
.node .stars .off{filter:brightness(0) opacity(.35)}
.node.closed .ball>.ei{filter:brightness(0) opacity(.45)}
.node.closed .lk{position:absolute;left:50%;top:50%;z-index:2;transform:translate(-50%,-40%);line-height:0}
.node.closed .lk .ei{font-size:24px;vertical-align:0}
.node.passed .ball::before{background:rgba(255,205,60,.55);border:3px solid #f0a51a;box-shadow:0 0 8px rgba(255,200,40,.9)}
.node.dia .ball::before{background:rgba(140,230,255,.55);border-color:#38bdf8;box-shadow:0 0 10px #67e8f9}
.node .ball.nx::before{border-color:var(--nc)}
.node.current .ball::before{width:54px;height:18px;bottom:-8px;background:rgba(74,168,255,.45);border:3px solid #2f8cf0;box-shadow:0 0 10px #4aa8ff;animation:ringPulse 1s ease-in-out infinite}
.node.current .ball>.ei{animation:bounce 1s ease-in-out infinite}
.node.current.cur-flash .ball::before{animation:ringPulse .4s ease-in-out 6;box-shadow:0 0 0 4px #fff,0 0 20px 8px #4aa8ff}
.node .here{position:absolute;left:-26px;bottom:-2px;z-index:3;line-height:0;animation:bounce 1.1s ease-in-out infinite;filter:drop-shadow(0 2px 0 rgba(58,42,30,.4))}
.node .here .ei{font-size:40px;vertical-align:0}
.node .here .ei.art{width:auto;height:40px}
@keyframes ringPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.18)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ---------- BATTLE ---------- */
#battle{background:var(--night);padding:8px 10px 12px;gap:8px}
.btop{display:flex;align-items:center;gap:8px}
.btop .ibtn{width:46px;height:46px}
.btop .ibtn .ei{font-size:28px}
#bTitle{flex:1;min-width:0;text-align:center;color:#fff;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arena{position:relative;flex:1 1 auto;min-height:150px;border-radius:22px;border:4px solid var(--c-line);overflow:hidden;background:var(--wbg) center 70%/cover no-repeat;display:flex;justify-content:space-between;align-items:flex-end;padding:0 6px 8px}
.arena.artbg{background-position:center bottom}
.arena::after{content:"";position:absolute;left:8%;right:8%;bottom:14px;height:16px;border-radius:50%;background:rgba(0,0,0,.22);z-index:0}
.fighter{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;width:44%}
.sprite{line-height:0;animation:bob 1.6s ease-in-out infinite}
.sprite .ei{font-size:clamp(78px,23vw,118px);vertical-align:0;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.mon .sprite:not(.hit):not(.lunge):not(.dodge):not(.dead){animation-delay:-.8s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tag{position:relative;z-index:2;font-size:14px;color:#fff;background:rgba(58,42,30,.8);border:var(--c-lw-s) solid var(--c-line);border-radius:10px;padding:1px 10px;white-space:nowrap}
/* 勇士血条（和怪兽血条同一个 .bar）：绿色；低于 30% 变红闪烁；挨打抖一下，回血亮一下 */
.mon .bar,.hero .bar{width:100%;max-width:150px}
.bar.life{z-index:2}
.bar.life>i{background:linear-gradient(var(--cg1) 50%,var(--cg2) 0)}
.bar.life.low>i{background:linear-gradient(var(--cr1) 50%,var(--cr2) 0);animation:lowBlink .6s steps(2,jump-none) infinite}
.bar.life.low{animation:lowRing .6s ease-in-out infinite}
.bar.life.lhurt{animation:lifeHurt .4s}
.bar.life.gain{animation:lifeGain .5s}
@keyframes lowBlink{50%{opacity:.35}}
@keyframes lowRing{50%{box-shadow:var(--c-sh-press),0 0 0 3px #ff4d5e,0 0 12px 3px #ff4d5e}}
@keyframes lifeHurt{0%,100%{transform:none}20%{transform:translateY(-5px)}45%{transform:translateY(3px)}70%{transform:translateY(-2px)}}
@keyframes lifeGain{40%{filter:brightness(1.3);box-shadow:var(--c-sh-press),0 0 14px 4px #5ad14f}}
.charge{width:100%;max-width:150px;height:10px;border-radius:999px;border:var(--c-lw-s) solid var(--c-line);background:rgba(58,42,30,.6);overflow:hidden}
.charge i{display:block;height:100%;width:0;background:linear-gradient(var(--cy1) var(--c-split),var(--cy2) 0)}
.charge.hot i{background:linear-gradient(var(--cr1) 50%,var(--cr2) 0)}
.grow{position:relative;transform-origin:bottom center;transition:transform .15s linear}
.mon.angry .grow::after{content:"";position:absolute;top:-4px;right:-2px;width:34px;height:34px;background:var(--warn-img) center/contain no-repeat;animation:pulse .45s infinite}
.mon.angry .sprite:not(.hit):not(.lunge):not(.dead){animation:rage .2s infinite}
.mon.angry .sprite .ei{filter:drop-shadow(0 0 10px rgba(255,0,0,.95))}
@keyframes rage{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,2px) rotate(-3deg)}75%{transform:translate(3px,-2px) rotate(3deg)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.hit{animation:hit .45s}
@keyframes hit{0%{filter:none;transform:translateX(0)}30%{filter:brightness(2.4) saturate(0);transform:translateX(14px) rotate(8deg)}100%{filter:none;transform:translateX(0)}}
/* 怪兽受击（勇士打中时）：第 0 帧就是命中姿势（闪白 + 压扁 + 被打退），定格时停在这一帧；然后弹回。Boss 更重 */
.sprite.hit{transform-origin:50% 100%;animation:monHit .5s cubic-bezier(.2,.8,.3,1)}
.sprite.hit.heavy{animation:monHitB .65s cubic-bezier(.2,.8,.3,1)}
.sprite.hit.crit{animation-duration:.6s}
@keyframes monHit{0%{filter:brightness(3) saturate(0);transform:translateX(16px) scale(1.28,.7)}25%{filter:brightness(1.6) saturate(.4);transform:translateX(30px) scale(.84,1.2) rotate(6deg)}55%{filter:none;transform:translateX(10px) scale(1.08,.94)}78%{transform:translateX(2px) scale(.97,1.03)}100%{filter:none;transform:none}}
@keyframes monHitB{0%{filter:brightness(3) saturate(0);transform:translateX(12px) scale(1.2,.78)}25%{filter:brightness(1.8) saturate(.3);transform:translateX(22px) scale(.88,1.14) rotate(4deg)}40%{transform:translateX(16px) scale(1.06,.95)}60%{filter:none;transform:translateX(6px) scale(.97,1.03)}100%{filter:none;transform:none}}
.lunge{animation:lunge .5s cubic-bezier(.5,0,.6,1)!important}
/* 怪物闪避：往后上方一跳躲开，再落回原地；「闪避！」是蓝色大字 */
.dodge{animation:monDodge .7s cubic-bezier(.3,.9,.4,1)!important}
@keyframes monDodge{0%{transform:none}25%{transform:translate(38%,-22%) rotate(14deg) scale(.92)}55%{transform:translate(30%,-8%) rotate(8deg)}100%{transform:none}}
.dmg.hitn.dodgetxt{white-space:nowrap}
.dmg.hitn.dodgetxt b{font:400 40px/1 var(--f-ui);color:#7dd3fc;-webkit-text-stroke:7px var(--ink);text-shadow:0 4px 0 var(--ink)}
@keyframes lunge{0%{transform:translateX(0)}10%{transform:translateX(10%) scale(.92)}30%{transform:translateX(-115%) scale(1.35)}100%{transform:translateX(0)}}
/* 勇士出手：冲到怪兽面前（--dash 由 JS 量出来），35% 处命中；拿剑挥砍带转身，空手是直拳 */
.atk-slash{animation:heroSlash .48s cubic-bezier(.3,0,.4,1)}
.atk-punch{animation:heroPunch .48s cubic-bezier(.3,0,.4,1)}
@keyframes heroSlash{0%{transform:none}12%{transform:translateX(-10px) rotate(-10deg) scale(.95)}35%{transform:translateX(var(--dash,80px)) rotate(14deg) scale(1.08)}55%{transform:translateX(calc(var(--dash,80px)*.9)) rotate(6deg)}100%{transform:none}}
@keyframes heroPunch{0%{transform:none}12%{transform:translateX(-8px) scale(.94,1.04)}35%{transform:translateX(var(--dash,80px)) scale(1.12,.94)}55%{transform:translateX(calc(var(--dash,80px)*.9))}100%{transform:none}}
.attack{animation:attack .35s}
@keyframes attack{0%,100%{transform:translateX(0)}50%{transform:translateX(30%) rotate(-8deg)}}
.hurt{animation:hurt .6s!important}
@keyframes hurt{0%{transform:none;filter:none}12%{transform:translateX(-26px) rotate(-16deg);filter:brightness(1.5) sepia(1) saturate(8) hue-rotate(-40deg)}40%{transform:translateX(-10px) rotate(-6deg)}100%{transform:none;filter:none}}
.dead{animation:dead .9s forwards}
@keyframes dead{to{transform:rotate(540deg) scale(0);opacity:0}}
.hwrap{position:relative}
.shield{position:absolute;left:50%;top:50%;width:135%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:3px solid rgba(90,200,255,.95);background:radial-gradient(circle,rgba(90,200,255,.04) 40%,rgba(90,200,255,.4));box-shadow:0 0 18px rgba(90,200,255,.9);animation:shieldPulse 1.2s ease-in-out infinite;pointer-events:none}
@keyframes shieldPulse{50%{transform:translate(-50%,-50%) scale(1.07)}}
.shield.pop{animation:shieldPop .5s forwards}
@keyframes shieldPop{to{transform:translate(-50%,-50%) scale(1.7);opacity:0}}
.hero .sprite .ei{filter:drop-shadow(0 0 8px var(--hcol,transparent)) drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.hero.gold .sprite .ei{filter:drop-shadow(0 0 6px #ffd700) drop-shadow(0 0 18px #ffb300)}
/* 道具按钮：52×52、间距 20px，防误触（试玩报告） */
.items{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:20px;z-index:5}
.item{position:relative;width:52px;height:52px;border-radius:50%;border:var(--c-lw) solid var(--c-line);background:linear-gradient(var(--cw1) var(--c-split),var(--cw2) 0);display:grid;place-items:center;box-shadow:var(--c-sh)}
.item .ei{font-size:32px;vertical-align:0}
.item:active{transform:translateY(3px);box-shadow:var(--c-sh-press)}
.item:disabled{filter:grayscale(1);opacity:.45}
.item.used{animation:pop .5s}
.combo{position:absolute;top:66px;left:50%;transform:translateX(-50%);font:400 24px var(--f-ui);color:#ffcd3c;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;white-space:nowrap;z-index:5}
.combo.pop{animation:cpop .4s}
@keyframes cpop{0%{transform:translateX(-50%) scale(.5)}60%{transform:translateX(-50%) scale(1.3)}100%{transform:translateX(-50%) scale(1)}}
/* 连击档位：3 连金光、5 连火焰、10 连彩虹（字、勇士光环、竞技场边框一起变） */
.combo.c1{color:#ffe14d;text-shadow:0 0 12px #ffd000}
.combo.c2{font-size:28px;color:#ff9a1f;text-shadow:0 0 14px #ff5a00,0 0 26px #ff9a1f}
.combo.c3{font-size:32px;color:#fff;text-shadow:0 0 10px #ff4df0,0 0 22px #4dd2ff;animation:cpop .4s,rainbowT .6s linear infinite}
@keyframes rainbowT{0%{color:#ff6b6b}25%{color:#ffe14d}50%{color:#5ad14f}75%{color:#4dd2ff}100%{color:#ff6b6b}}
.arena[data-combo="1"] .hero .sprite{filter:drop-shadow(0 0 8px #ffe14d)}
.arena[data-combo="2"] .hero .sprite{filter:drop-shadow(0 0 8px #ff9a1f) drop-shadow(0 0 18px #ff5a00)}
.arena[data-combo="3"] .hero .sprite{filter:drop-shadow(0 0 10px #ff4df0) drop-shadow(0 0 22px #4dd2ff)}
.arena[data-combo="2"]{box-shadow:inset 0 0 26px rgba(255,120,0,.75)}
.arena[data-combo="3"]{animation:rainbowB .8s linear infinite}
@keyframes rainbowB{0%{box-shadow:inset 0 0 30px #ff4df0}33%{box-shadow:inset 0 0 30px #ffe14d}66%{box-shadow:inset 0 0 30px #4dd2ff}100%{box-shadow:inset 0 0 30px #ff4df0}}
/* 蓄力快满：道具按钮闪烁 +「快用冰冻！」（这时先把连击字收起来，免得叠在一起） */
.item.nudge{animation:nudge .5s ease-in-out infinite;box-shadow:var(--c-sh),0 0 18px 6px #4dd2ff}
@keyframes nudge{50%{transform:scale(1.16)}}
.urge{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:5;padding:3px 12px;border-radius:14px;border:var(--c-lw) solid var(--c-line);background:#e0f7ff;color:#0b5c8a;font:400 18px/1.3 var(--f-ui);white-space:nowrap;pointer-events:none;animation:pulse .5s infinite}
.arena.urging .combo:not(.warn){visibility:hidden}
.banner{position:absolute;inset:0;z-index:9;display:grid;place-items:center;text-align:center;pointer-events:none;padding:0 10px}
.banner>div{animation:bannerIn 1.4s forwards}
.banner .ribbon{font-size:26px}
.banner .warn{display:flex;flex-direction:column;gap:4px;align-items:center;background:#14080a;color:#ff3b3b;border:7px solid #ffcc00;border-image:repeating-linear-gradient(45deg,#ffcc00 0 12px,#14080a 12px 24px) 7;padding:10px 20px}
.banner .warn b{font:800 clamp(26px,8vw,36px)/1 var(--f-num);letter-spacing:3px;white-space:nowrap}
.banner .warn span{font-size:22px;color:#fff}
@keyframes bannerIn{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.08);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.95)}}
.dmg{position:absolute;z-index:6;pointer-events:none;font:800 36px var(--f-num);color:#ff4d5e;-webkit-text-stroke:5px #fff;paint-order:stroke fill;animation:dmg .85s forwards}
.dmg.mon{right:14%;bottom:58%}
.dmg.big{font-size:48px;color:#ff8a00}
.dmg.me{left:10%;bottom:58%}
/* 勇士挨打的数字：红色大字，暴击更大、写「暴击！」；回血绿色 */
.dmg.hitn.me{bottom:auto}
.dmg.hitn.me b{color:#ff4d5e}
.dmg.hitn.me.crit b{font-size:64px;color:#ff2a2a;-webkit-text-stroke:8px var(--ink)}
.dmg.hitn.me.heal b{color:#7ee36b;font-size:44px}
@keyframes dmg{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-50px) scale(1.2);opacity:0}}
/* 打在怪兽身上的数字：大号描边，暴击更大更黄、带「暴击!」 */
.dmg.hitn{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);animation:hitn .9s cubic-bezier(.2,1.4,.4,1) forwards;z-index:8}
.dmg.hitn b{font:800 52px/1 var(--f-num);color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.dmg.hitn i{font:400 22px/1 var(--f-ui);font-style:normal;color:#fff;-webkit-text-stroke:5px #b4001e;paint-order:stroke fill;margin-bottom:-2px}
.dmg.hitn.crit b{font-size:74px;color:#ffe14d;-webkit-text-stroke:8px #b4001e;text-shadow:0 5px 0 #5a0010,0 0 18px #ffb300}
@keyframes hitn{0%{transform:translate(-50%,-50%) scale(1.9);opacity:1}18%{transform:translate(-50%,-50%) scale(.92)}28%{transform:translate(-50%,-50%) scale(1.05)}70%{opacity:1;transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-110%) scale(.9)}}
/* 刀光（颜色 = 武器品质）和拳击冲击波 */
.slash{position:absolute;z-index:6;pointer-events:none;transform:translate(-50%,-50%)}
.slash svg{display:block;width:100%;height:100%;overflow:visible}
.slash path{fill:none;stroke-linecap:round;stroke-dasharray:130;stroke-dashoffset:130;animation:slashDraw .45s ease-out forwards}
.slash .sg{stroke:var(--qc,#fff);stroke-width:10;filter:drop-shadow(0 0 5px var(--qc,#fff)) drop-shadow(0 0 12px var(--qc,#fff))}
.slash .sc{stroke:#fff;stroke-width:3}
.slash.crit .sg{stroke-width:12}
.slash.crit path:nth-child(n+3){animation-delay:.04s}
@keyframes slashDraw{0%{stroke-dashoffset:130;opacity:1}20%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.punchfx{position:absolute;z-index:6;width:0;height:0;pointer-events:none}
.punchfx .ring{position:absolute;left:-44px;top:-44px;width:88px;height:88px;border-radius:50%;border:7px solid #fff;box-shadow:0 0 14px #ffe14d;animation:ring .42s ease-out forwards}
.punchfx .ring.r2{left:-28px;top:-28px;width:56px;height:56px;border-color:#ffe14d;animation-delay:.05s}
@keyframes ring{0%{transform:scale(.35);opacity:1}100%{transform:scale(1.8);opacity:0}}
/* 命中定格：竞技场里的动作停住一下（伤害数字照常弹出） */
.arena.hitstop .sprite,.arena.hitstop .slash path,.arena.hitstop .punchfx .ring,.arena.hitstop .fx .ei{animation-play-state:paused!important}
.toast{position:absolute;left:0;right:0;top:42%;z-index:8;display:flex;justify-content:center;pointer-events:none}
.toast>div{display:flex;align-items:center;gap:8px;padding:8px 18px;border-radius:18px;border:var(--c-lw) solid var(--c-line);background:var(--cw1);color:var(--ink);font:400 24px var(--f-ui);box-shadow:var(--c-sh);animation:toast 1.3s forwards}
.toast .ei{font-size:40px}
@keyframes toast{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.1);opacity:1}25%{transform:scale(1)}80%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
.shot{position:absolute;z-index:4;bottom:40%;left:24%;width:56px;height:56px;pointer-events:none;animation:shot .32s ease-in forwards;filter:drop-shadow(0 0 8px var(--sc,#fff)) drop-shadow(0 0 16px var(--sc,#fff))}
.shot .ei{font-size:56px;vertical-align:0}
@keyframes shot{from{left:24%;transform:scale(.6) rotate(0)}to{left:64%;transform:scale(1.5) rotate(360deg)}}
.fx,.part{position:absolute;z-index:6;pointer-events:none;width:0;height:0}
.fx .ei,.part .ei{position:absolute;left:0;top:0;vertical-align:0}
.fx .ei{font-size:96px;margin:-48px 0 0 -48px;animation:fx .6s ease-out forwards}
.fx.big .ei{font-size:150px;margin:-75px 0 0 -75px}
@keyframes fx{0%{transform:scale(.2) rotate(-30deg);opacity:1}60%{opacity:1}100%{transform:scale(1.4) rotate(25deg);opacity:0}}
.part .ei{font-size:30px;margin:-15px 0 0 -15px;animation:part .9s ease-out forwards}
@keyframes part{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(260deg);opacity:0}}
.tint{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0;background:var(--tc,#fff)}
.tint.on{animation:tint .4s}
@keyframes tint{0%{opacity:.5}100%{opacity:0}}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:20;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 25%,rgba(255,0,0,.65))}
.flash.on{animation:flashA .55s}
@keyframes flashA{0%{opacity:1}100%{opacity:0}}
.vig{position:absolute;inset:0;pointer-events:none;z-index:20;opacity:0;box-shadow:inset 0 0 70px 28px rgba(255,0,0,.8)}
.vig.on{animation:flashA .9s ease-out}
.cd{position:absolute;left:50%;top:50%;z-index:21;pointer-events:none;font:800 clamp(150px,50vw,250px)/1 var(--f-num);color:#ff3b4e;-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 10px 0 var(--ink);opacity:0;transform:translate(-50%,-50%)}
.cd.on{animation:cdPop .95s ease-out forwards}
@keyframes cdPop{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:.95;transform:translate(-50%,-50%) scale(.95)}100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}}
#battle.quake{animation:quake .45s}
#battle.quakeS{animation:quakeS .22s}
@keyframes quakeS{0%,100%{transform:none}30%{transform:translate(-4px,2px)}65%{transform:translate(3px,-2px)}}
@keyframes quake{0%,100%{transform:translate(0,0)}15%{transform:translate(-9px,5px)}30%{transform:translate(8px,-6px)}45%{transform:translate(-6px,-3px)}60%{transform:translate(5px,4px)}80%{transform:translate(-2px,2px)}}
/* 道具：去错把一个错误选项变灰；消除 / 连连看里亮出一对正确的 */
.ans.gone{opacity:.25;filter:grayscale(1);pointer-events:none}
.pairhint{animation:pairHint .7s ease-in-out infinite;box-shadow:0 0 0 4px #ffe14d,0 0 16px 6px #ffe14d!important}
@keyframes pairHint{50%{transform:scale(1.06)}}
/* 主角待机：站着时轻轻呼吸、上下浮动（和怪兽 bob 同一 1.6 秒节奏），武器盾牌在 .hwrap 里跟着动 */
.hero .hwrap{transform-origin:50% 100%;animation:breathe 1.6s ease-in-out infinite}
.hero .sprite:not(.atk-slash):not(.atk-punch):not(.hurt):not(.attack){animation:none}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-5px) scale(1.015,.985)}}
/* boss */
#battle.boss .arena{box-shadow:inset 0 0 0 999px rgba(60,0,0,.35)}
#battle.boss .fighter.mon{width:56%}
#battle.boss .fighter.hero{width:40%}
#battle.boss .mon .sprite .ei{font-size:clamp(118px,35vw,176px);filter:drop-shadow(0 0 10px rgba(255,0,0,.9)) drop-shadow(0 0 26px rgba(255,90,0,.7))}
#battle.boss .grow::before{content:"";position:absolute;left:50%;bottom:-12%;width:150%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,70,0,.65),rgba(255,0,0,0) 66%);animation:aura .9s ease-in-out infinite alternate;z-index:-1}
@keyframes aura{from{opacity:.45;transform:translateX(-50%) scale(.88)}to{opacity:1;transform:translateX(-50%) scale(1.1)}}
#battle.boss .mon .bar{max-width:210px;height:24px}
#battle.boss .mon .tag{background:#5a0d14}
/* 狂暴 (day's rage level >= 1): red glow around the monster */
#battle.rage .mon .sprite{filter:drop-shadow(0 0 8px rgba(255,40,40,.95)) drop-shadow(0 0 20px rgba(255,0,0,.6))}
/* 怪兽狂暴（血量 ≤ 40%，Boss 半血暴怒）：偏红变暗、眼睛红光、头上 💢、身后黑红蒸汽（Boss 红色闪电），一直抖；变大 1.1 倍在 JS（#monGrow 的 scale） */
.mon.fury .sprite:not(.hit):not(.lunge):not(.dodge):not(.dead):not(.dying){animation:rage .22s infinite}
#battle .mon.fury .sprite .ei{filter:sepia(.6) saturate(2.8) hue-rotate(-30deg) brightness(.72) contrast(1.15) drop-shadow(0 0 8px rgba(255,30,0,.95))}
#battle .mon.bossfury .sprite .ei{filter:sepia(.6) saturate(3) hue-rotate(-32deg) brightness(.7) contrast(1.15) drop-shadow(0 0 12px rgba(255,0,0,1)) drop-shadow(0 0 26px rgba(255,60,0,.8))}
.furyfx{display:none;position:absolute;inset:0;pointer-events:none}
.mon.fury .furyfx{display:block}
.mon.fury .grow{z-index:0}
.furyfx .steam{position:absolute;left:50%;bottom:8%;width:120%;height:110%;transform:translateX(-50%);z-index:-1}
.furyfx .steam i{position:absolute;bottom:0;width:46%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(120,0,10,.75),rgba(40,0,0,.45) 45%,rgba(40,0,0,0) 70%);animation:steam 1.6s ease-out infinite}
.furyfx .steam i:nth-child(1){left:2%}
.furyfx .steam i:nth-child(2){left:30%;animation-delay:-.55s;width:52%}
.furyfx .steam i:nth-child(3){right:2%;animation-delay:-1.1s}
@keyframes steam{0%{transform:translateY(10%) scale(.6);opacity:0}25%{opacity:1}100%{transform:translateY(-70%) scale(1.25);opacity:0}}
.furyfx .eyes{position:absolute;left:26%;right:26%;top:30%;height:18%;display:flex;justify-content:space-between;z-index:2}
.furyfx .eyes i{width:36%;height:100%;border-radius:50%;background:radial-gradient(circle,#fff6d0 0 7%,#ff3b1f 15%,rgba(255,0,0,.75) 32%,rgba(255,0,0,0) 68%);animation:eyeGlow .7s ease-in-out infinite alternate}
@keyframes eyeGlow{from{opacity:.65;transform:scale(.85)}to{opacity:1;transform:scale(1.15)}}
.furyfx .anger{position:absolute;left:6%;top:4%;z-index:3;font-size:clamp(30px,9vw,42px);line-height:0;animation:anger .5s ease-in-out infinite}
@keyframes anger{50%{transform:scale(1.25) rotate(-10deg)}}
.furyfx .bolts{position:absolute;left:-14%;top:-6%;width:128%;height:112%;z-index:-1;overflow:visible;animation:bolts .35s steps(2,jump-none) infinite}
.furyfx .bolts path{fill:none;stroke:#ffe14d;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 2px #ff2a2a) drop-shadow(0 0 4px #ff0000) drop-shadow(0 0 10px #ff0000)}
@keyframes bolts{50%{opacity:.25}}
.mname{position:relative;z-index:2;display:flex;align-items:center;gap:3px;max-width:100%}
.mname .tag{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tag.furytag{flex:none;display:inline-flex;align-items:center;gap:1px;padding:1px 6px;background:linear-gradient(var(--cr1) var(--c-split),var(--cr2) 0);animation:pulse .6s infinite}
.tag.furytag .ei{font-size:15px}
.tag.furytag .num{font:800 14px/1 var(--f-num)}
.banner .ribbon.fury{--c1:#c81e3a;--c2:#8a0f22;--ct:#5a0814}
.sprite.dying{animation:dying .1s infinite!important}
.sprite.dying .ei{filter:brightness(2) saturate(.3)!important}
@keyframes dying{0%,100%{transform:translate(0,0)}25%{transform:translate(-9px,4px) rotate(-5deg)}75%{transform:translate(9px,-4px) rotate(5deg)}}
.ko{position:absolute;left:50%;top:45%;z-index:11;font:800 clamp(84px,27vw,136px)/1 var(--f-num);color:#ffd400;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);transform:translate(-50%,-50%);animation:ko 1.8s forwards;pointer-events:none;white-space:nowrap}
@keyframes ko{0%{transform:translate(-50%,-50%) scale(4);opacity:0}12%{transform:translate(-50%,-50%) scale(.9);opacity:1}20%{transform:translate(-50%,-50%) scale(1.05)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}
.whiteout{position:fixed;inset:0;background:#fff;z-index:40;pointer-events:none;animation:flashA .8s forwards}

/* question card + answers */
.qcard{position:relative;flex:none;min-height:88px;display:flex;align-items:center;justify-content:center;padding:12px 14px}
/* 本题还剩多少时间（卡片底边的细条；怪兽蓄力在怪兽脚下） */
.qhint{position:absolute;right:6px;top:6px;width:40px;height:40px;border-radius:12px;animation:pulse 1s infinite}
.qhint .ei{font-size:24px}
/* 辅导弹窗：战斗画面中央，遮罩 + 卡片；战斗区不缩放 */
.tutor{position:absolute;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(16,12,40,.62)}
.tutor .hint{position:relative;width:100%;max-width:440px;max-height:100%}
/* 辅导卡右上角的 ✕；「我懂了！」轻轻呼吸，提示孩子点它 */
.tutor .tclose{position:absolute;right:-8px;top:-8px;z-index:3;width:44px;height:44px}
.tutor #stDone{animation:okBreathe 1.6s ease-in-out infinite}
@keyframes okBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.tutor .hint.on{animation:pageIn .3s cubic-bezier(.2,1.4,.4,1)}
.qtag{position:absolute;left:14px;top:-14px;z-index:2;font-size:14px;padding:2px 12px;border-radius:10px;border:var(--c-lw-s) solid var(--c-line);background:var(--purple);color:#fff}
.qtag.py{background:#ff6fae}
.q{font:800 clamp(40px,11vw,56px)/1.1 var(--f-num);display:flex;align-items:center;justify-content:center;gap:.22em;flex-wrap:wrap;color:var(--ink)}
.q.small{font-size:clamp(28px,8.5vw,40px);gap:.18em}
.q.fit{flex-wrap:nowrap;white-space:nowrap}
.q .op{color:var(--ink2)}
.blank{display:inline-grid;place-items:center;min-width:1.3em;height:1.2em;border-radius:12px;border:4px dashed var(--gold-d);color:var(--gold-d);background:#fff3cf}
.q .term{background:#f1e3c8;border-radius:10px;padding:0 .2em;min-width:1.1em;text-align:center}
.q .comma{color:var(--ink2);font-size:.7em}
.q .ei{font-size:1.05em}
.speak{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:42px;height:42px}
.speak:active{transform:translateY(-50%) translateY(2px)}
.speak .ei{font-size:26px}
.q.wordq{display:block;font:400 clamp(17px,4.7vw,20px)/1.65 var(--f-ui);text-align:left}
.wordq .wpic{float:left;margin:2px 8px 0 0}
.wordq .wpic .ei{font-size:44px}
.wordq .n{font:800 1.3em/1 var(--f-num);color:var(--blue-d);padding:0 2px}
.wordq .nm{font-weight:400;color:var(--red-d)}
.wordq .ei{font-size:1.2em}
.hintbtn{display:flex;align-items:center;gap:6px;margin:6px 0 0 auto;min-height:38px;padding:4px 14px;font-size:16px;border-radius:14px}
.hintbtn .ei{font-size:24px}
.qcard.word{display:block;padding:14px}
.pyq{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.pyq .pic .ei{font-size:52px}
.pyq .hz{font-family:var(--f-hz);font-weight:400;font-size:1.25em;line-height:1}
.pyq .py,.ans .py{font-family:var(--f-py);font-weight:700}
.pyq .ask{font:400 18px var(--f-ui);color:var(--ink2);flex-basis:100%;text-align:center}
.pyq .ask b{font-weight:400;color:var(--red-d)}
.pyq .plus{color:var(--ink2)}
.answers{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answers.three{grid-template-columns:repeat(3,1fr)}
.ans{position:relative;min-height:clamp(60px,9.5vh,80px);border-radius:20px;border:var(--c-lw) solid var(--c-line);background:linear-gradient(var(--cw1) var(--c-split),var(--cw2) 0);color:var(--ink);
  font:800 clamp(34px,10vw,46px)/1 var(--f-num);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:var(--c-sh)}
.ans:active{transform:translateY(4px);box-shadow:var(--c-sh-press)}
.ans small{font:400 14px var(--f-ui);color:var(--ink2)}
.ans .ei{font-size:44px;vertical-align:0}
.ans .py{font-size:clamp(28px,8.5vw,38px)}
.ans .hz{font-family:var(--f-hz);font-weight:400;font-size:clamp(40px,12vw,54px)}
.ans .tn{font:700 40px var(--f-py);line-height:.8}
.ans.wrong{background:linear-gradient(var(--cr1) var(--c-split),var(--cr2) 0);color:#fff;opacity:.6}
.ans.wrong small{color:#fff}
.ans.right{background:linear-gradient(var(--cg1) var(--c-split),var(--cg2) 0);color:#fff}
.ans.right small{color:#fff}
.ans:disabled{cursor:default}
/* 算术消除 / 连连看 board (replaces question card + answers) */
#battle.boardmode .qcard,#battle.boardmode .hint,#battle.boardmode .answers{display:none!important}
.board{flex:none}
.mboard{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),auto);gap:8px}
.mslot{position:relative;min-height:56px;display:grid}
.mboard.two .mslot{min-height:72px;padding:0 6px 8px 0}
.mcard{grid-area:1/1;position:relative;min-height:56px;border-radius:14px;border:var(--c-lw) solid var(--c-line);background:linear-gradient(var(--cw1) var(--c-split),var(--cw2) 0);color:var(--ink);
  font:800 clamp(17px,5.2vw,22px)/1 var(--f-num);display:grid;place-items:center;padding:2px;box-shadow:var(--c-sh);white-space:nowrap}
.mcard.sm{font-size:clamp(14px,4.3vw,18px)}
.mcard:active{transform:translateY(3px);box-shadow:var(--c-sh-press)}
.mcard.sel{background:linear-gradient(var(--cy1) var(--c-split),var(--cy2) 0);transform:translateY(-3px);box-shadow:0 0 0 3px #fff,var(--c-sh),0 0 16px #ffd23f}
.mcard.bad{background:linear-gradient(var(--cr1) var(--c-split),var(--cr2) 0);color:#fff}
.mboard.two .mcard{margin:0}
/* 2 层：被压住的卡露出一条边，拿走上面的才翻上来 */
.mcard.under{transform:translate(6px,8px);background:repeating-linear-gradient(45deg,#8b5cf6 0 8px,#7c4ddb 8px 16px);box-shadow:var(--c-sh);z-index:0}
.mcard:not(.under){z-index:1}
.lboard{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:56px}
.lcol{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.llines{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.llines line{stroke:var(--green);stroke-width:6;stroke-linecap:round}
.lnk{min-height:54px;border-radius:16px;border:var(--c-lw) solid var(--c-line);background:linear-gradient(var(--cw1) var(--c-split),var(--cw2) 0);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--c-sh)}
.lnk .ei{font-size:28px}
.lnk b{font:400 34px/1 var(--f-hz)}
.lnk .py{font:700 28px/1 var(--f-py)}
.lnk.sel{background:linear-gradient(var(--cy1) var(--c-split),var(--cy2) 0);box-shadow:0 0 0 3px #fff,var(--c-sh),0 0 16px #ffd23f}
.lnk.done{background:linear-gradient(var(--cg1) var(--c-split),var(--cg2) 0);color:#fff;opacity:.9}
.lnk.bad{background:linear-gradient(var(--cr1) var(--c-split),var(--cr2) 0);color:#fff}
/* hint panel */
.hint{min-height:0;overflow:auto;padding:12px 14px;font-size:16px;line-height:1.55}
.hint>.stepnav:only-child,.hint>.stepnav:last-child{margin-top:10px}
.hint p{margin:0 0 4px}
.hint b{font-family:var(--f-num);font-size:19px;font-weight:800}
.hint .htitle{display:flex;align-items:center;gap:6px;font-size:18px;color:var(--red-d)}
.hint .htitle .ei{font-size:24px}
.hint .py{font-family:var(--f-py);font-weight:700;font-size:19px}
.hint .ei{font-size:1.3em}
.stept{font-size:16px;line-height:1.6;margin:2px 0 6px}
.stepnav{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:8px}
.stepno{margin-right:auto;white-space:nowrap;display:flex;align-items:center;gap:4px;font:800 16px var(--f-num);color:var(--red-d)}
.stepno .ei{font-size:22px}
#battle.wordmode .hint{padding:10px 12px}
.stepnav .btn{min-height:42px;font-size:17px;padding:4px 14px;border-radius:14px;white-space:nowrap}
.stepnav .ibtn{width:42px;height:42px}
.stepnav .ibtn .ei{font-size:24px}
.frames{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.frame{display:grid;grid-template-columns:repeat(5,20px);gap:3px;background:var(--cw1);border-radius:8px;padding:4px;border:2px solid #e9dcae}
.dot{width:20px;height:20px;border-radius:50%}
.dot.a{background:#ff8a3d}.dot.b{background:#3d8bff}
.dot.x{background:#ffcaa8;position:relative}
.dot.x::after{content:"";position:absolute;left:-2px;right:-2px;top:8px;height:4px;background:var(--red-d);transform:rotate(-40deg);border-radius:2px}
.dot.e{border:2px dashed #3d8bff}.dot.n{background:#f2f2f2}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:800 22px var(--f-num);margin-top:4px}
.steps .arr{font:400 13px var(--f-ui);color:var(--red-d)}
.bm{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.bmrow{display:grid;grid-template-columns:3.4em 1fr;align-items:center;gap:6px}
.bml{font-size:15px;text-align:right;white-space:nowrap}
.bmbar{display:flex;height:28px}
.seg{height:100%;display:grid;place-items:center;font:800 15px var(--f-num);font-style:normal;border:var(--c-lw-s) solid var(--c-line);margin-right:-2px;background:#ffb07a;white-space:nowrap}
.seg.b{background:#8fc1ff}.seg.c{background:#a6e3a1}.seg.g{background:#e5e7f0}
.seg.d{background:repeating-linear-gradient(45deg,#fff 0 6px,#ffe08a 6px 12px);border-style:dashed}
.seg.x{background:var(--cw1);color:#9aa0b8;border-style:dashed;text-decoration:line-through}
.seg.q{background:var(--cw1);color:var(--red-d)}
.seg.hl{box-shadow:0 0 0 3px #ef4444 inset;color:#b91c1c}
.bmbr{position:relative;height:28px}
.brace{position:absolute;top:0;height:10px;border:2px solid var(--red-d);border-top:0;border-radius:0 0 10px 10px}
.brace em{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-style:normal;font-size:15px;color:var(--red-d);white-space:nowrap}
.ppl{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0;align-items:flex-end}
.pp{width:26px;height:26px;border-radius:50%;background:#d6dbe9;display:grid;place-items:center;font:800 13px var(--f-num)}
.pp.f{background:#93c5fd}.pp.b{background:#86efac}.pp.m{background:#fde047}
.pp.me{background:#f97316;color:#fff;font:400 13px var(--f-ui);box-shadow:0 0 0 3px #fff,0 0 0 5px #f97316}
.pp.hl{animation:pulse .8s infinite}
.pp.x{background:#fff;border:2px dashed #9aa0b8}
.front{font-size:13px;color:var(--ink2);align-self:center;margin-right:2px}
.log{display:flex;align-items:center;margin:8px 0;flex-wrap:wrap;row-gap:6px}
.log .wood{height:24px;width:40px;background:#c98b4a;border:2px solid #7a4a1d;border-radius:6px}
.log .cut{font-style:normal;font-size:18px;margin:0 2px;color:#dc2626}
.xrow{font-size:24px;margin:4px 0;line-height:1.2}
.xrow .eq{font:800 20px var(--f-num);margin:0 6px;color:var(--ink2)}

/* ---------- PAGES (overlays that always fit one screen) ---------- */
.modal{position:fixed;inset:0;z-index:30;background:rgba(16,12,40,.66);display:flex;align-items:center;justify-content:center;padding:calc(28px + var(--sat)) calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal))}
.page{position:relative;width:100%;max-width:440px;max-height:100%;display:flex;flex-direction:column;align-items:stretch;padding:34px 16px 18px;animation:pageIn .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pageIn{from{transform:scale(.88);opacity:0}}
.page.gold{box-shadow:inset 0 0 0 5px var(--cy2),var(--c-sh-l),0 0 50px rgba(255,200,0,.75);background:linear-gradient(#fff8dc var(--c-split),#ffeab0 0)}
.page>.phead{position:absolute;top:-22px;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
.page>.phead .ribbon{pointer-events:auto}
.page .back{position:absolute;left:-6px;top:-18px;z-index:3;width:50px;height:50px;border-radius:50%}
.page .back .chev{width:14px;height:14px;border-left:5px solid var(--ink);border-bottom:5px solid var(--ink);transform:translateX(3px) rotate(45deg);border-radius:2px}
.pbody{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 4px 6px;margin:0 -4px;display:flex;flex-direction:column;gap:12px;text-align:center}
.pbody p{margin:0;color:var(--ink2);font-size:16px;line-height:1.5}
.row{display:flex;gap:10px;justify-content:center;align-items:center}
.btnrow{display:flex;gap:10px;align-items:center}
.btnrow .btn{flex:1}
.bubble{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;background:var(--ink);color:#fff;padding:10px 16px;border-radius:16px;font-size:17px;line-height:1.4;opacity:0;pointer-events:none;width:max-content;max-width:86%;text-align:center}
.bubble .ei{font-size:24px}
.bubble.on{animation:bub 3s forwards}
@keyframes bub{0%{opacity:0;transform:translate(-50%,10px)}8%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
/* reward pieces */
.bigstars{display:flex;justify-content:center;gap:6px}
.bigstars .ei{font-size:clamp(52px,15vw,66px);vertical-align:0}
.bigstars .s{display:inline-block;animation:starPop .5s cubic-bezier(.2,1.8,.4,1) backwards}
.bigstars .off .ei{filter:brightness(0) opacity(.25)}
@keyframes starPop{0%{transform:scale(0) rotate(-180deg)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
.wintitle{font-size:clamp(40px,12vw,52px);line-height:1.1;animation:winIn .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes winIn{from{transform:scale(.2) rotate(-12deg);opacity:0}}
.note{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;border:var(--c-lw) solid var(--c-line);background:var(--cw1);padding:8px 12px;font-size:17px;line-height:1.35;text-align:left;animation:pageIn .5s .6s backwards}
.note .ei{font-size:40px;flex:none}
.chest{display:flex;flex-direction:column;align-items:center;gap:2px;margin:0 auto}
.chest .ei{font-size:clamp(92px,28vw,120px);animation:chest .9s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(58,42,30,.25))}
.chest small{font-size:18px;color:var(--red-d)}
.chest.gold .ei{filter:drop-shadow(0 0 22px #ffd700)}
.chest.s1 .ei{animation-duration:.45s;filter:brightness(1.15) drop-shadow(0 0 22px #ffd700)}
.chest.s2 .ei{animation-duration:.2s;filter:brightness(1.4) drop-shadow(0 0 30px #fff6a0)}
@keyframes chest{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg) scale(1.06)}40%{transform:rotate(12deg) scale(1.12)}60%{transform:rotate(-6deg)}}
.loot{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.lt{position:relative;width:84px;height:84px;display:grid;place-items:center;animation:stkIn .65s cubic-bezier(.2,1.6,.4,1) backwards}
.lt::before{content:"";position:absolute;inset:0;border-radius:50%;border:var(--c-lw) solid var(--c-line);background:repeating-conic-gradient(#ffe48a 0 12deg,#fff8dc 12deg 24deg);animation:spin 6s linear infinite}
.lt.r::before{background:repeating-conic-gradient(#ffb3f0 0 12deg,#c7b5ff 12deg 24deg)}
.lt.l::before{background:repeating-conic-gradient(#7dd3fc 0 10deg,#fde68a 10deg 20deg,#f9a8d4 20deg 30deg)}
.lt.it::before{background:repeating-conic-gradient(#bbf7d0 0 12deg,#f0fdf4 12deg 24deg)}
.lt>.ei{position:relative;font-size:54px;vertical-align:0}
.lt .tagnew{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);z-index:1;white-space:nowrap;font-size:13px;padding:1px 8px;border-radius:10px;border:var(--c-lw-s) solid var(--c-line);background:var(--red);color:#fff}
.lt.r .tagnew{background:var(--purple)}.lt.l .tagnew{background:#0ea5e9}.lt.it .tagnew{background:var(--green-d)}
.lt .cnt{right:2px;top:-2px;bottom:auto}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes stkIn{from{transform:scale(0) rotate(-40deg)}}
/* gear (装备): quality frame + glow. --g1 resting glow, --g2 peak glow, --gt pulse speed; rarer = bigger and faster, orange/red also get a shine sweep */
.q-white{--g1:0px;--g2:0px;--gt:3s}
.q-blue{--g1:6px;--g2:10px;--gt:3s}
.q-pink{--g1:8px;--g2:18px;--gt:2s}
.q-purple{--g1:10px;--g2:26px;--gt:1.5s}
.q-orange{--g1:12px;--g2:32px;--gt:1.1s}
.q-red{--g1:14px;--g2:40px;--gt:.8s}
@keyframes qGlow{50%{box-shadow:inset 0 0 0 3px var(--qc),var(--c-sh),0 0 var(--g2) var(--qc)}}
@keyframes tGlow{50%{box-shadow:inset 0 0 0 3px var(--qc),var(--c-sh-press),0 0 var(--g2) var(--qc)}}
@keyframes gShine{60%,100%{transform:translateX(120%)}}
@keyframes gIn{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.gsay{margin:0!important;font-size:17px!important;color:var(--ink)!important;display:flex;align-items:center;justify-content:center;gap:4px}
.gsay .ei{font-size:26px}
.gcard{position:relative;flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:18px;border:var(--c-lw) solid var(--c-line);background:linear-gradient(var(--cw1) var(--c-split),var(--qb) 0);text-align:left;overflow:hidden;
  box-shadow:inset 0 0 0 3px var(--qc),var(--c-sh),0 0 var(--g1) var(--qc);animation:qGlow var(--gt) ease-in-out infinite}
.gcard.pop{animation:gIn .55s cubic-bezier(.2,1.6,.4,1) backwards,qGlow var(--gt) ease-in-out .55s infinite}
.gcard.q-purple::after,.gcard.q-orange::after,.gcard.q-red::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.8) 50%,transparent 65%);transform:translateX(-120%);animation:gShine 3s ease-in-out infinite}
.gcard.q-orange::after{animation-duration:2s}
.gcard.q-red::after{animation-duration:1.2s}
.gmain{display:flex;align-items:center;gap:10px}
.gicon{position:relative;flex:none;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:var(--cw1);border:var(--c-lw) solid var(--c-line);box-shadow:inset 0 0 0 3px var(--qc)}
.gicon .ei{font-size:44px;vertical-align:0}
.ginfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ginfo b{font-weight:400;font-size:19px;line-height:1.2;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ginfo small{font-size:13px;color:var(--ink2)}
.afxs,.gstats{display:flex;flex-wrap:wrap;gap:4px}
.afx{display:inline-flex;align-items:center;gap:1px;height:26px;padding:0 7px 0 3px;border-radius:13px;background:var(--cw1);border:var(--c-lw-s) solid var(--c-line);white-space:nowrap}
.afx .ei{font-size:18px;vertical-align:0}
.afx b{font:800 14px/1 var(--f-num);color:var(--ink)}
.gprev{flex:none;width:78px;display:grid;place-items:center;padding:12px 0 4px}
.gprev .av>.ei{font-size:50px}
.gup{position:absolute;right:-9px;top:-9px;width:26px;height:26px;border-radius:50%;background:var(--green);border:var(--c-lw-s) solid var(--c-line);display:grid;place-items:center;animation:pulse 1s infinite}
.gup .chev{width:10px;height:10px;border-left:4px solid #fff;border-bottom:4px solid #fff;transform:translateY(2px) rotate(135deg)}
.gwear{min-height:44px;font-size:19px;padding:4px 14px}
.gwear .ei{font-size:26px}
.gextra{display:flex;align-items:center;gap:4px;font-size:15px;color:var(--ink2)}
.gextra .ei{font-size:24px;vertical-align:0}
.gextra b{font:800 15px var(--f-num);color:var(--ink);margin-right:4px}
.gcard.mini{padding:8px 10px;gap:6px}
.gcard.mini .gicon{width:54px;height:54px}
.gcard.mini .gicon .ei{font-size:38px}
/* hero + gear stacked on head / hands / chest (placeholder art) */
.av{position:relative;display:inline-block;line-height:0}
.av .ag{position:absolute;width:40%;aspect-ratio:1;line-height:0;filter:drop-shadow(0 0 2px var(--qc)) drop-shadow(0 0 5px var(--qc))}
.av .ag>.ei{width:100%;height:100%;vertical-align:top;filter:none!important}
.av .ag.helmet{top:-24%;left:30%}
.av .ag.weapon{right:-22%;bottom:4%;width:44%}
.av .ag.shield{left:-20%;bottom:4%}
.av .ag.armor{bottom:-8%;left:33%;width:34%}
/* original art (src/art): 小勇士's whole look comes from one picture (hero_base / hero_<品质>), weapon and shield pictures in the hands */
.ei.art{object-fit:contain}
/* the box is exactly the hero picture; --fr / --fl / --fy = where its right / left fist is (fractions of the picture).
   The sword's grip (84% down the blade picture) sits in the right fist, the shield's centre on the left fist. */
.av.lay{--fr:.22;--fl:.80;--fy:.71}
.av.lay.a-orange{--fy:.62;--fl:.77}
/* 其他人形勇士（h1 忍者、h3 宇航员、h7 国王）：宇航服更宽，手更低、更靠外 */
.av.lay.a-h3{--fr:.20;--fl:.82;--fy:.74}
.av.lay>.ei.art{height:1.3em;width:auto}
.av.lay .hand{position:absolute;height:auto;pointer-events:none;filter:drop-shadow(0 0 2px var(--qc)) drop-shadow(0 0 5px var(--qc))}
.av.lay .hand.rh{width:36%;left:calc(var(--fr)*100% - 18%);top:calc(var(--fy)*100% - 52%);transform:rotate(-18deg);transform-origin:50% 84%}
.av.lay .hand.lh{width:42%;left:calc(var(--fl)*100% - 21%);top:calc(var(--fy)*100% - 17%);transform:rotate(6deg)}
/* 没有手的勇士（独角兽）：武器、盾牌悬浮在身体两侧，轻轻上下浮动 */
.av.lay.float .hand{width:32%}
.av.lay.float .hand.rh{left:calc(var(--fr)*100% - 20%);animation:hFloatR 2.4s ease-in-out infinite}
.av.lay.float .hand.lh{left:calc(var(--fl)*100% - 12%);animation:hFloatL 2.4s ease-in-out -1.2s infinite}
@keyframes hFloatR{0%,100%{transform:translateY(0) rotate(-18deg)}50%{transform:translateY(-9%) rotate(-12deg)}}
@keyframes hFloatL{0%,100%{transform:translateY(0) rotate(6deg)}50%{transform:translateY(-9%) rotate(0deg)}}
/* 穿了盔甲：脚下一圈盔甲品质颜色的光环（在勇士原画后面） */
.av.lay>.ei.art{position:relative}
.av.lay .helm{position:absolute;z-index:2;width:calc(var(--hw)*100%);left:calc(var(--hx)*100%);top:calc(var(--hy)*100%);transform:translate(-50%,-70%) rotate(-6deg);pointer-events:none;line-height:0;filter:drop-shadow(0 0 2px var(--qc)) drop-shadow(0 0 4px var(--qc))}
/* 「长大了」演出 */
.evo{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 45%,rgba(90,60,170,.92),rgba(16,12,40,.96) 70%);display:flex;align-items:center;justify-content:center;padding:calc(20px + var(--sat)) calc(12px + var(--sar)) calc(20px + var(--sab)) calc(12px + var(--sal))}
.evobox{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:360px}
.evostage{position:relative;width:100%;height:min(62vh,400px);font-size:min(30vh,190px)}
.evostage>.evoa,.evostage>.evob{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.evo.evo-glow .evostage .av{filter:brightness(0) invert(1) drop-shadow(0 0 10px #fff) drop-shadow(0 0 24px #c4b5fd)}
.evo.evo-glow .evostage{animation:evoPulse .6s ease-in-out infinite alternate}
@keyframes evoPulse{from{transform:scale(1)}to{transform:scale(1.04)}}
.evoflash{position:absolute;left:-30%;right:-30%;top:-10%;bottom:-10%;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.85) 30%,rgba(255,255,255,0) 70%);opacity:0;pointer-events:none}
.evo.evo-flash .evoflash{animation:evoFlash .7s ease-out}
@keyframes evoFlash{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.5)}}
.evo.evo-done .evob{animation:evoPop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes evoPop{from{transform:scale(.85)}to{transform:scale(1)}}
.evotxt{font:800 22px var(--f-ui);color:#fff;text-align:center;min-height:1.4em}
.evotxt .num{font-family:var(--f-num);color:#ffd23f}
.evobox .btn{min-width:180px}
.av.lay .helm .ei{width:100%;height:auto;font-size:inherit;filter:none}   /* 不吃勇士图的投影，不然阴影落在脸上 */
.av.lay .aura{position:absolute;left:4%;right:4%;bottom:-5%;height:16%;border-radius:50%;border:var(--c-lw) solid var(--c-line);background:var(--qc);opacity:.9;box-shadow:0 0 0 3px var(--qc),0 0 12px 2px var(--qc)}
/* rewards (家长 10-21): experience bar, gear experience, drops — no chest step */
.page.win .pbody{gap:10px}
.rexp{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:16px;border:var(--c-lw) solid var(--c-line);background:var(--cw1)}
.rlv{flex:none;font-size:17px;color:var(--ink)}
.rexp .rxi{flex:none;font-size:26px;margin-right:-4px}
.rlv b{font:800 22px/1 var(--f-num);color:var(--purple-d)}
.xbar{position:relative;flex:1;height:18px;border-radius:9px;border:var(--c-lw) solid var(--c-line);background:#f1e3c8;overflow:hidden}
.xbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(var(--cg1) var(--c-split),var(--cg2) 0);border-radius:9px;transition:width .75s ease-out}
.rgain{flex:none;font:800 18px/1 var(--f-num);color:var(--green-d)}
.rgx{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font-size:15px;color:var(--ink2)}
.rgp{display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 8px 0 2px;border-radius:14px;border:var(--c-lw-s) solid var(--c-line);box-shadow:inset 0 0 0 2px var(--qc,transparent);background:var(--cw1)}
.rgp .ei{font-size:22px;vertical-align:0}
.rgp b{font:800 14px/1 var(--f-num);color:var(--ink)}
.rdrops{display:flex;flex-direction:column;gap:8px}
.drow{position:relative;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:16px;border:var(--c-lw) solid var(--c-line);background:linear-gradient(var(--cw1) var(--c-split),var(--qb) 0);text-align:left;box-shadow:inset 0 0 0 3px var(--qc),var(--c-sh),0 0 var(--g1) var(--qc);animation:gIn .5s cubic-bezier(.2,1.6,.4,1) backwards}
.drow .gicon{width:52px;height:52px}
.drow .gicon .ei{font-size:36px}
.drow .ginfo b{font-size:17px}
.drow .ginfo small{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtag{font-weight:400;color:#fff;background:var(--red);border-radius:8px;padding:0 6px;font-size:12px}
.dbtns{flex:none;display:flex;flex-direction:column;gap:6px}
.dbtns .btn{min-height:34px;padding:2px 10px;font-size:15px;border-radius:12px;gap:2px;box-shadow:var(--c-sh)}
.dbtns .btn .ei{font-size:20px}
.drow.gone{justify-content:center;min-height:52px;background:#f3f1fa;border-color:#cfcae4;box-shadow:0 0 0 2px var(--ink);animation:none}
.dgone{font-size:15px;color:var(--ink2)}
.dgone .ei{font-size:22px}
.rchips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.rchip{display:inline-flex;align-items:center;gap:3px;height:32px;padding:0 10px 0 4px;border-radius:16px;border:var(--c-lw-s) solid var(--c-line);box-shadow:inset 0 0 0 2px var(--qc,transparent);background:var(--cw1);font-size:15px;color:var(--ink)}
.rchip .ei{font-size:24px;vertical-align:0}
.rchip b{font:800 15px/1 var(--f-num)}
.lvup{position:absolute;left:50%;top:38%;z-index:6;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:max-content;max-width:92%;
  padding:12px 18px;border-radius:20px;border:4px solid var(--c-line);background:linear-gradient(var(--cy1) var(--c-split),var(--cy2) 0);box-shadow:var(--c-sh-l),0 0 40px #ffd23f;text-align:center;pointer-events:none}
.lvup b{font:400 30px/1.1 var(--f-ui);color:var(--ink)}
.lvup span{font-size:16px;color:var(--ink)}
.lvup .ei{font-size:24px}
.lvup.on{animation:winIn .6s cubic-bezier(.2,1.6,.4,1)}
/* map: hero level under the avatar */
.topbar .avatarbtn{overflow:visible}
.lvb{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);min-width:44px;height:20px;padding:0 6px 3px;border-radius:10px;border:var(--c-lw-s) solid var(--c-line);background:var(--cp2);color:#fff;font-size:12px;line-height:15px;white-space:nowrap;overflow:hidden}
.lvb b{font:800 13px/15px var(--f-num)}
.lvb i{position:absolute;left:0;bottom:0;height:3px;background:var(--gold)}
/* battle: what the monster may drop */
.droptag{position:relative;z-index:2;display:flex;align-items:center;gap:2px;height:20px;padding:0 7px 0 3px;border-radius:10px;border:var(--c-lw-s) solid var(--c-line);background:var(--cw1);color:var(--ink);font-size:12px;white-space:nowrap}
.droptag .ei{font-size:16px;vertical-align:0}
.droptag b{font:800 12px/1 var(--f-num)}
.droptag.boss{background:linear-gradient(var(--cy1) var(--c-split),var(--cy2) 0)}
.droptag:empty{display:none}
/* win page: stars → next hero; level-up bonus; level page; map note */
.nexth{display:flex;align-items:center;justify-content:center;gap:3px;font-size:15px!important;white-space:nowrap}
.nexth .ei{font-size:22px}
.nexth b{font:800 17px/1 var(--f-num);color:var(--red-d)}
.lvup .lvbonus{display:flex;align-items:center;gap:4px;font-size:20px}
.lvup .lvbonus b{font:800 22px/1 var(--f-num);color:var(--red-d)}
.lvup .lvnext{font-size:14px;color:var(--ink2)}
.lvstats{display:flex;gap:10px;justify-content:center}
.lvs{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border-radius:16px;border:var(--c-lw) solid var(--c-line);background:var(--cw1);font-size:16px}
.lvs .ei{font-size:34px}
.lvs b{font:800 26px/1 var(--f-num);color:var(--red-d)}
.lvpage .pbody p .ei{font-size:20px}
.mapnote{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:6px;padding:4px 14px 4px 6px;border-radius:18px;border:var(--c-lw) solid var(--c-line);background:var(--cw1);color:var(--ink);font-size:17px;white-space:nowrap;box-shadow:var(--c-sh);animation:toast 3.5s forwards;pointer-events:none}
.mapnote .ei{font-size:28px}
.mapnote b{font:800 18px/1 var(--f-num);color:var(--red-d)}
/* flee */
.fleeart{font-size:84px;line-height:1}
/* bag: levels, salvage, ascend, synth */
.glv{display:flex;align-items:center;gap:6px;margin-top:2px}
.glv b{font:800 14px/1 var(--f-num);color:var(--purple-d)}
.glv small{font:800 12px/1 var(--f-num);color:var(--ink2)}
.gxbar{position:relative;flex:1;height:10px;border-radius:5px;border:var(--c-lw-s) solid var(--c-line);background:#f1e3c8;overflow:hidden}
.gxbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(var(--cb1) var(--c-split),var(--cb2) 0)}
.gbtns{display:flex;gap:8px}
.gbtns .btn{flex:1;min-height:40px;font-size:16px;padding:2px 8px;gap:2px}
.gbtns .btn .ei{font-size:22px}
.gascend{width:100%;min-height:40px;font-size:16px;gap:2px}
.gascend .ei{font-size:22px}
.ghint{display:block;text-align:center;font-size:13px;color:var(--ink2)}
.ghint .ei{font-size:18px}
.bagbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bagsm{position:relative;min-height:34px;padding:2px 8px 2px 4px;font-size:14px;gap:2px;border-radius:12px;box-shadow:var(--c-sh)}
.bagsm .ei{font-size:22px}
.bagsm b{font:800 14px var(--f-num)}
.pill.stones{height:32px;padding:0 8px 0 2px}
.pill.stones .ei{font-size:22px}
.stip{width:22px;height:22px;margin-left:4px;border-radius:50%;border:var(--c-lw-s) solid var(--c-line);background:var(--cy1);color:var(--ink);font:800 14px/1 var(--f-num);display:grid;place-items:center}
.gt.locked{filter:grayscale(.85);opacity:.6;animation:none}
.gt[data-lv]::before{content:attr(data-lv);position:absolute;left:-4px;top:-6px;z-index:1;font:800 11px/1 var(--f-num);padding:2px 4px;border-radius:7px;border:var(--c-lw-s) solid var(--c-line);background:var(--cw1);color:var(--ink)}
.gt.picked{outline:4px solid var(--green);outline-offset:2px}
.qtabs{display:flex;gap:6px;justify-content:center}
.qtab{flex:1;min-width:0;height:38px;border-radius:12px;border:var(--c-lw) solid var(--c-line);background:var(--cw1);box-shadow:inset 0 -6px 0 var(--qc),var(--c-sh-press);display:flex;align-items:center;justify-content:center;gap:3px;font-size:15px;color:var(--ink)}
.qtab b{font:800 13px/1 var(--f-num);color:var(--ink2)}
.qtab.on{background:var(--qc);color:#fff}
.qtab.on b{color:#fff}
.ggrid.haul{grid-template-columns:repeat(6,minmax(0,1fr))}
/* bag page */
.bagtop{display:flex;align-items:center;gap:12px}
.bagav{flex:none;width:118px;height:108px;display:grid;place-items:center;border-radius:18px;border:var(--c-lw) solid var(--c-line);background:radial-gradient(circle at 50% 45%,#fff,var(--cw2));padding-top:14px}
.bagav .av>.ei{font-size:62px}
.bagside{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.gempty{text-align:left!important;font-size:15px!important}
.bagchest{min-height:44px;font-size:18px;padding:4px 10px;gap:4px}
.bagchest .ei{font-size:26px}
.bagchest b{font:800 18px var(--f-num)}
.gnone{display:flex;align-items:center;justify-content:center;gap:10px;min-height:96px;border-radius:18px;border:3px dashed #cfcae4;color:var(--ink2);font-size:16px;text-align:left}
.gnone .ei{font-size:44px;filter:grayscale(1);opacity:.5}
.ggone .ei{filter:none;opacity:1}
.synrow #sBack{flex:0 0 auto;padding:8px 14px}
.synhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.synhead .gsay{margin:0;text-align:left}
.synhead #sAuto{flex:none;white-space:nowrap;padding:6px 10px;gap:4px}
.synplan{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:16px;border:var(--c-lw) solid var(--c-line);background:var(--cw1);font-size:17px}
.synplan p{margin:0}
#aNo,#aGo{white-space:nowrap}
.synplan .num{font:800 20px var(--f-num)}
.synrow #sGo{white-space:nowrap;padding:8px 10px;gap:4px}
.ggrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:2px 4px}
.gt{position:relative;aspect-ratio:1;max-height:66px;border-radius:14px;border:var(--c-lw) solid var(--c-line);background:var(--cw1);display:grid;place-items:center;box-shadow:inset 0 0 0 3px var(--qc),var(--c-sh-press),0 0 var(--g1) var(--qc);animation:tGlow var(--gt) ease-in-out infinite}
.gt .ei{font-size:min(9vw,40px);vertical-align:0}
.gt.sel{outline:3px solid var(--ink);outline-offset:2px}
.gt.worn::after{content:"穿戴中";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);white-space:nowrap;font-size:11px;line-height:1;padding:2px 5px;border-radius:8px;border:var(--c-lw-s) solid var(--c-line);background:var(--green);color:#fff}
.gpager{display:flex;align-items:center;justify-content:center;gap:14px}
.gpager .ibtn{width:40px;height:40px}
.gpager b{font:800 17px var(--f-num);color:var(--ink2)}
/* short screens (375×667): the bag (and 合成, same page) is the fullest page; on macOS / iOS its fonts are taller than on
   Linux, so tighten it to keep ≥ 24px free there (smoke_test checks 16px spare on Linux) */
@media (max-height:700px){
  .page.bag .pbody{gap:6px}
  .page.bag .bagav{height:86px;padding-top:8px}
  .page.bag .bagav .av>.ei{font-size:56px}
  .page.bag .ggrid{gap:6px}
  .rnext{font-size:12px;white-space:nowrap;letter-spacing:-.3px}.rnext .ei{font-size:14px}   /* 矮屏：「离 Lv.7 还差…升级加…」一行放下 */
